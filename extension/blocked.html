<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Stay focused · Grove</title>
  <link rel="stylesheet" href="shared/ui.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; }
    .box { text-align: center; max-width: 420px; padding: 2rem; }
    .plant-wrap { width: 220px; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="box timer">
    <div class="plant-wrap" id="plant"></div>
    <h1>This site is blocked</h1>
    <p class="sub" id="msg">Your plant is still growing.</p>
    <div class="clock" id="clock"></div>
    <div class="row">
      <button id="back">Back to focus</button>
      <button class="ghost" id="giveup">Give up (plant withers)</button>
    </div>
  </div>
  <script type="module" src="blocked.js"></script>
</body>
</html>
